<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;" />
  <title>IntelliPointer selection</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <canvas id="view"></canvas>

  <div id="toolbar" role="toolbar" aria-label="Selection tools">
    <div class="group" id="tools">
      <button class="icon-btn" data-tool="rect" data-icon="square-dashed" title="Rectangle (R). Hold Shift for a square."></button>
      <button class="icon-btn" data-tool="square" data-icon="square" title="Square (S)"></button>
      <button class="icon-btn" data-tool="ellipse" data-icon="circle-dashed" title="Ellipse (E). Hold Shift for a circle."></button>
      <button class="icon-btn" data-tool="lasso" data-icon="lasso" title="Freehand (L)"></button>
    </div>
    <div class="group">
      <button class="icon-btn" data-tool="pen" data-icon="pen-line" title="Pen (P)"></button>
      <button class="icon-btn" data-tool="arrow" data-icon="arrow-up-right" title="Arrow (A)"></button>
      <button class="icon-btn" data-tool="highlight" data-icon="highlighter" title="Highlighter (H)"></button>
      <button class="icon-btn" data-tool="blur" data-icon="eye-off" title="Redact (B). Pixelates the area before anything is sent."></button>
    </div>
    <div class="group">
      <button class="swatch" data-color="#e5484d" title="Red"></button>
      <button class="swatch" data-color="#30a46c" title="Green"></button>
      <button class="swatch" data-color="#0b63ce" title="Blue"></button>
      <button class="swatch" data-color="#f5a524" title="Amber"></button>
      <input id="width" type="range" min="2" max="16" value="4" title="Stroke width" aria-label="Stroke width" />
    </div>
    <div class="group">
      <button class="icon-btn" id="undo" data-icon="undo-2" title="Undo (Ctrl+Z)"></button>
      <button class="icon-btn" id="redo" data-icon="redo-2" title="Redo (Ctrl+Y)"></button>
      <button class="icon-btn" id="clear" data-icon="trash-2" title="Clear all"></button>
      <button class="icon-btn" id="mask" data-icon="crop" title="Mask outside ellipse and freehand shapes (M)" aria-pressed="true"></button>
    </div>
    <div class="group" id="quick"></div>
    <div class="group">
      <button id="cancel" class="btn ghost" title="Cancel (Esc)">Cancel</button>
      <button id="ask" class="btn primary" title="Ask about the selection (Enter)">Ask <span class="key" data-icon="corner-down-left" data-icon-size="13"></span></button>
    </div>
  </div>
  <div id="hint">Drag to select. Drag a selection to move it, or a corner to resize. Alt+drag adds an overlapping region.</div>

  <script src="../shared/icons.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
