<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self';" />
  <title>Ask</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="bubble.css" />
</head>
<body>
  <div id="bar" role="toolbar" aria-label="Ask about the selected text">
    <button id="ask" class="btn ghost ask" title="Ask a question about this text"><span class="logo" aria-hidden="true"></span>Ask</button>
    <span class="sep"></span>
    <span id="commands"></span>
    <button id="close" class="icon-btn" data-icon="x" title="Dismiss"></button>
  </div>
  <script src="../shared/icons.js"></script>
  <script src="bubble.js"></script>
</body>
</html>
