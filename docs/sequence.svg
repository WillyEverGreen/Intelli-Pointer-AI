<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2937"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111111"/></marker>
    <style>
      .head { fill: #f3f4f6; stroke: #111111; stroke-width: 1.4; }
      .ht { font-size: 14px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .life { stroke: #cbd5e1; stroke-width: 1.4; stroke-dasharray: 5 5; }
      .m { stroke: #1f2937; stroke-width: 1.6; fill: none; }
      .mb { stroke: #111111; stroke-width: 1.8; fill: none; }
      .ret { stroke: #64748b; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; }
      .l { font-size: 12.5px; fill: #1f2937; }
      .lb { font-size: 12.5px; fill: #111111; font-weight: 600; }
      .n { font-size: 11px; fill: #64748b; }
      .band { fill: #f8fafc; }
      .bt { font-size: 12px; font-weight: 700; fill: #334155; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#fff"/>
  <text x="600" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">One question, end to end</text>

  <!-- participants: x centres -->
  <g>
    <rect class="head" x="40" y="50" width="130" height="40" rx="8"/><text class="ht" x="105" y="75">User</text>
    <rect class="head" x="230" y="50" width="150" height="40" rx="8"/><text class="ht" x="305" y="75">Desktop app</text>
    <rect class="head" x="450" y="50" width="170" height="40" rx="8"/><text class="ht" x="535" y="75">Firebase Auth</text>
    <rect class="head" x="690" y="50" width="170" height="40" rx="8"/><text class="ht" x="775" y="75">API (cloud)</text>
    <rect class="head" x="930" y="50" width="130" height="40" rx="8"/><text class="ht" x="995" y="75">Firestore</text>
    <rect class="head" x="1080" y="50" width="110" height="40" rx="8"/><text class="ht" x="1135" y="75">Gemini</text>
  </g>
  <g>
    <line class="life" x1="105" y1="90" x2="105" y2="735"/>
    <line class="life" x1="305" y1="90" x2="305" y2="735"/>
    <line class="life" x1="535" y1="90" x2="535" y2="735"/>
    <line class="life" x1="775" y1="90" x2="775" y2="735"/>
    <line class="life" x1="995" y1="90" x2="995" y2="735"/>
    <line class="life" x1="1135" y1="90" x2="1135" y2="735"/>
  </g>

  <rect class="band" x="20" y="104" width="1170" height="22"/><text class="bt" x="30" y="120">Sign in (once; the refresh token is kept encrypted with Windows DPAPI)</text>
  <path class="m" d="M105 150 H300" marker-end="url(#a)"/><text class="l" x="112" y="144">1  Alt+Shift+S, mark a region</text>
  <path class="m" d="M305 178 H530" marker-end="url(#a)"/><text class="l" x="312" y="172">2  email + password (HTTPS)</text>
  <path class="ret" d="M530 202 H310" marker-end="url(#a)"/><text class="l" x="330" y="196">3  ID token (1 h) + refresh token</text>

  <rect class="band" x="20" y="222" width="1170" height="22"/><text class="bt" x="30" y="238">Capture and local processing (nothing leaves the PC yet)</text>
  <path class="m" d="M305 268 H340 V292 H310" marker-end="url(#a)"/><text class="l" x="350" y="284">4  frozen screenshot (BitBlt) → crop → local OCR</text>
  <path class="m" d="M105 320 H300" marker-end="url(#a)"/><text class="l" x="112" y="314">5  clicks "Explain"; panel states what will be sent</text>

  <rect class="band" x="20" y="342" width="1170" height="22"/><text class="bt" x="30" y="358">Request to the cloud API</text>
  <path class="mb" d="M305 392 H770" marker-end="url(#ab)"/><text class="lb" x="312" y="386">6  POST /v1/ask  (HTTPS · Bearer ID token · crop + OCR text + question)</text>
  <path class="m" d="M775 420 H540" marker-end="url(#a)"/><text class="l" x="562" y="414">7  verifyIdToken (revocation checked)</text>
  <path class="m" d="M775 448 H990" marker-end="url(#a)"/><text class="l" x="800" y="442">8  transaction: requests + 1</text>
  <path class="ret" d="M990 472 H780" marker-end="url(#a)"/><text class="l" x="800" y="466">allowed (used / limit)</text>
  <text class="n" x="790" y="492">validate image magic bytes · size · model supports images</text>
  <path class="m" d="M775 516 H1130" marker-end="url(#a)"/><text class="l" x="880" y="510">9  stream request (key from server secrets)</text>

  <rect class="band" x="20" y="540" width="1170" height="22"/><text class="bt" x="30" y="556">Answer streams back as Server-Sent Events</text>
  <path class="ret" d="M1130 586 H780" marker-end="url(#a)"/><text class="l" x="880" y="580">10  tokens</text>
  <path class="mb" d="M770 614 H310" marker-end="url(#ab)" stroke-dasharray="6 4"/><text class="lb" x="338" y="608">11  event: meta · delta · delta … · done {usage, timings}</text>
  <path class="m" d="M305 642 H340 V666 H310" marker-end="url(#a)"/><text class="l" x="350" y="658">12  Markdown rendered as it arrives (first word as soon as the model emits it)</text>
  <path class="m" d="M775 692 H990" marker-end="url(#a)"/><text class="l" x="800" y="686">13  add token counts (no content)</text>
  <path class="ret" d="M300 716 H110" marker-end="url(#a)"/><text class="l" x="130" y="710">14  follow-ups reuse the same screenshot</text>
</svg>
