name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop:
    name: Desktop (check, tests, audit, installer build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=moderate
      # Proves the installer builds and the packaged app starts (no publishing).
      - run: npm run dist
